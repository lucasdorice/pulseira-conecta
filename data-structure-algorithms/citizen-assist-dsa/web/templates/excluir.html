{% extends "base.html" %}
{% block titulo %}Excluir serviço{% endblock %}
{% block conteudo %}
<h1>Excluir este serviço?</h1>
<p><strong>{{ s.titulo }}</strong> (ID {{ s.id }}, {{ s.categoria }}) será removido da lista. Essa ação não pode ser desfeita.</p>
<form method="post" class="acoes">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button class="perigo" type="submit">Excluir serviço</button>
  <a class="botao-sec" href="{{ url_for('detalhe', id_=s.id) }}">Cancelar</a>
</form>
{% endblock %}
