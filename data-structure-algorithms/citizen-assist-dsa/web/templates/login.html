{% extends "base.html" %}
{% block titulo %}Entrar como administrador{% endblock %}
{% block conteudo %}
<h1>Entrar como administrador</h1>
<p class="intro">Só quem gerencia o catálogo precisa entrar. Para consultar serviços, não é necessária senha.</p>
<form class="formulario" method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="proximo" value="{{ proximo }}">
  <div class="campo">
    <label for="senha">Senha de administrador</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  </div>
  <p class="acoes"><button type="submit">Entrar</button></p>
</form>
{% endblock %}
